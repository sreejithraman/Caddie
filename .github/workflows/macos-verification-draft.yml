name: macOS Verification Draft

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: macos-verification-draft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect macOS verification draft
        run: npm run verify:mac -- --output release-verification.json --github-actions

      - name: Validate macOS verification draft
        if: always()
        run: npm run verify:record -- release-verification.json

      - name: Upload macOS verification draft
        if: ${{ always() && hashFiles('release-verification.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-draft-${{ github.sha }}
          path: release-verification.json
          if-no-files-found: error
          retention-days: 14
